<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Préparation Psy · version de travail</title><link rel="stylesheet" href="psy-preparation.css"><style>
@font-face{font-family:'Cormorant Garamond';src:url('fonts/cormorant-garamond-latin-500-normal.woff2')}@font-face{font-family:'Cormorant Garamond';font-style:italic;src:url('fonts/cormorant-garamond-latin-500-italic.woff2')}@font-face{font-family:'Cormorant SC';src:url('fonts/cormorant-sc-latin-500-normal.woff2')}
body{margin:0;background:#f5e0d3;color:#6b3f55;font-family:'Cormorant Garamond',Georgia,serif}#psy{max-width:430px;margin:auto;padding:12px 16px}#qa-title{text-align:center;font:500 16px 'Cormorant SC',serif;letter-spacing:.16em}header{display:flex;align-items:center;gap:12px}header p{flex:1}button{color:inherit}header button,.qa-tools button{background:none;border:1px solid #cda5ab;border-radius:22px;padding:10px}small{display:block;text-align:center;margin:10px}.nuit{background:#2a1e26;color:#efd6e0}.qa-tools{text-align:center;margin:12px}
</style><script src="psy-preparation-store.js"></script><script src="psy-preparation.js"></script>
<small>Version de travail · données de test uniquement</small><div id="psy"><header><button id="qa-back" aria-label="Revenir">‹</button><p id="qa-title">MON ESPACE PSY</p></header><div id="qa-root"></div></div><div class="qa-tools"><button id="qa-reopen">Simuler une réouverture</button> <button id="qa-night">Jour / nuit</button></div><script>
const life=window.__enPsyPreparationStore.ensureLife({});let saved=window.__enPsyPreparationStore.createPreparation(),controller;
function open(){const holder=document.getElementById('qa-root');holder.innerHTML=window.__enPsyPreparationTemplate;controller=window.__enMountPsyPreparation(holder.firstElementChild,{stored:saved,life:()=>life,title:t=>document.getElementById('qa-title').textContent=t,scrollTop:()=>window.scrollTo(0,0),avatar:()=>{},save:async()=>{},peopleChanged:()=>{},ongoing:()=>alert('Le suivi existant est conservé dans l’application.'),later:()=>{controller.show('entry');window.scrollTo(0,0)}});}
open();document.getElementById('qa-back').onclick=()=>controller.back();document.getElementById('qa-reopen').onclick=()=>{saved=JSON.parse(JSON.stringify(controller.snapshot()));open()};document.getElementById('qa-night').onclick=()=>{document.body.classList.toggle('nuit');document.getElementById('psy').classList.toggle('nuit')};
</script></html>
